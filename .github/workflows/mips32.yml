name: HCGBA MIPS32
on:
  push:
    branches: [main, mips32-picoarch]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and MIPS runtime
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-mipsel-linux-gnu qemu-user
      - name: Host cached CPU and libretro tests
        run: |
          cmake -S . -B build-host -G Ninja -DHCGBA_PICOARCH=ON -DHCGBA_CACHED_CPU=ON -DHCGBA_LTO=OFF
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure
      - name: Cross compile and execute native MIPS code
        run: |
          cmake -S . -B build-mips -G Ninja -DHCGBA_PICOARCH=ON -DHCGBA_LTO=OFF \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=mipsel \
            -DCMAKE_C_COMPILER=mipsel-linux-gnu-gcc \
            '-DCMAKE_C_FLAGS=-EL -mabi=32 -march=mips32r2 -mfp32 -mhard-float -fno-strict-aliasing' \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-mipsel;-L;/usr/mipsel-linux-gnu'
          cmake --build build-mips --parallel 2
          ctest --test-dir build-mips --output-on-failure
          HCGBA_NO_NATIVE=1 qemu-mipsel -L /usr/mipsel-linux-gnu build-mips/hcgba-cpu-test
          mipsel-linux-gnu-readelf -h -A -d build-mips/hcgba_libretro.so
      - name: Exact interpreter build
        run: |
          cmake -S . -B build-exact -G Ninja -DHCGBA_PICOARCH=ON -DARMGBA_JIT=OFF -DHCGBA_LTO=OFF
          cmake --build build-exact --parallel 2
          ctest --test-dir build-exact --output-on-failure
  sf3000:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned SF3000 SDK
        run: |
          curl --fail --location --retry 3 \
            https://media.githubusercontent.com/media/700zx1/sf3000toolchain/06eb2b99c4627a1200ecce188a80e029b60ed33e/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz \
            -o /tmp/sf3000-sdk.tar.gz
          echo "4cc8c30895c99e924b676d68e93e4e2b1795ee63b112b1d50857b871ed3e46ce  /tmp/sf3000-sdk.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sf3000-sdk
          tar -xzf /tmp/sf3000-sdk.tar.gz -C /tmp/sf3000-sdk
          sdk=/tmp/sf3000-sdk/mipsel-buildroot-linux-gnu_sdk-buildroot
          cd "$sdk"
          if [ -f relocate-sdk.sh ]; then sh ./relocate-sdk.sh; fi
          cc=$(find "$sdk" -path '*/bin/mips-mti-linux-gnu-gcc' -type f | head -n1)
          test -n "$cc"
          echo "CROSS_COMPILE=${cc%gcc}" >> "$GITHUB_ENV"
          echo "SF3000_SYSROOT=$sdk/mipsel-buildroot-linux-gnu/sysroot" >> "$GITHUB_ENV"
      - name: Build with device libc and ABI
        run: sh picoarch/build-sf3000.sh
      - name: Package
        run: |
          mkdir -p dist
          cp build-sf3000/hcgba_libretro.so picoarch/hcgba_libretro.info picoarch/README.md dist/
          cp LICENSE LICENSES/MPL-2.0.txt dist/
          "${CROSS_COMPILE}strip" dist/hcgba_libretro.so
          sha256sum dist/hcgba_libretro.so > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hcgba-sf3000-mips32
          path: dist/
